<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La bibliothèque BUILD RH</title>
  <meta name="description" content="La bibliothèque BUILD RH : carrousels, infographies, guides et études sur les RH, l'inclusion, l'IA, le neuroatypisme, les outils et méthodes, et bien d'autres sujets.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b5b'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-weight='800' font-size='15' text-anchor='middle' fill='%23fff'%3ERH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#resultats">Aller aux ressources</a>

  <header class="hero">
    <div class="wrap">
      <div class="hero-top">
        <span class="logo" aria-label="BUILD RH">BUILD <span class="rh">RH</span></span>
        <button id="confort" class="toggle" type="button" aria-pressed="false">
          <span aria-hidden="true">Aa</span> Lecture confort
        </button>
      </div>
      <h1><span id="titre">Des ressources pour</span> <span class="hl" id="titre-accent">changer le travail.</span></h1>
      <p id="sous-titre" class="lead"></p>
      <ul id="sujets" class="sujets" aria-label="Sujets abordés"></ul>

      <div class="search">
        <label for="q" class="sr-only">Rechercher une ressource</label>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="TDAH, RQTH, onboarding…" autocomplete="off">
      </div>
      <div class="progress" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </header>

  <main class="wrap">
    <nav class="filters" aria-label="Filtrer les ressources">
      <div id="categories" class="chips" role="group" aria-label="Catégories"></div>
      <div class="controls">
        <label>Type
          <select id="type"><option value="">Tous</option></select>
        </label>
        <label>Trier
          <select id="tri">
            <option value="recent">Plus récents</option>
            <option value="ancien">Plus anciens</option>
            <option value="az">Titre A → Z</option>
          </select>
        </label>
      </div>
    </nav>

    <p id="compteur" class="count" aria-live="polite"></p>
    <section id="resultats" class="grid" aria-label="Ressources"></section>
    <div id="vide" class="empty" hidden>
      <p><strong>Aucune ressource ne correspond.</strong></p>
      <p>Essayez un autre mot-clé ou <button type="button" id="reset" class="linklike">réinitialisez les filtres</button>.</p>
    </div>
  </main>

  <footer class="wrap foot">
    <p><strong>BUILD RH</strong> · Les documents sont libres de partage, merci de citer la source.</p>
    <p id="contact"></p>
  </footer>

  <dialog id="visionneuse" aria-label="Aperçu">
    <div class="viewer-bar">
      <p id="viewer-titre"></p>
      <div class="viewer-actions">
        <a id="viewer-dl" class="btn small" download>Télécharger</a>
        <button type="button" class="btn small ghost" id="viewer-close">Fermer</button>
      </div>
    </div>
    <div class="viewer-body"><img id="viewer-img" alt=""></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="catalogue.js"></script>
  <script src="app.js"></script>
</body>
</html>
